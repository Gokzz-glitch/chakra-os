<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>CHAKRA GI Clinical OS</title>
<style>
body{font-family:system-ui,sans-serif;background:#0b1120;color:#e2e8f0;max-width:1100px;margin:24px auto;padding:0 16px}
.card{background:#111c33;border:1px solid #1e3a5f;border-radius:12px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
button{background:#0284c7;color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer}
button.ok{background:#059669} button:disabled{opacity:.5}
img{max-width:100%;border-radius:8px;border:1px solid #334155}
pre{background:#020617;padding:12px;border-radius:8px;overflow:auto;font-size:12px}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;background:#1e293b}
</style><style>*{box-sizing:border-box}img,video,canvas,select,input{max-width:100%}.grid>*{min-width:0}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:740px){.grid{grid-template-columns:minmax(0,1fr)}body{margin:12px auto}}</style><script src="/v2/assets/operation-feedback.js"></script></head><body>
<div class="card"><h2>CHAKRA GI Clinical OS <span id="gpu" class="badge">Waking L4 GPU...</span></h2>
<input type="file" id="f" accept="image/*">
BBPS R:<input id="r" type="number" value="3" min="0" max="3" style="width:40px">
T:<input id="t" type="number" value="3" min="0" max="3" style="width:40px">
L:<input id="l" type="number" value="2" min="0" max="3" style="width:40px">
Withdrawal(s):<input id="w" type="number" value="540" style="width:65px">
<button onclick="run()">Analyze Frame + Draft Report</button>
<button id="signBtn" class="ok" onclick="signoff()" disabled>HITL Physician Sign-Off -> BigQuery</button>
</div>
<div class="grid">
  <div class="card"><h3>Live Vision Output</h3><div id="vmeta"></div><img id="img"></div>
  <div class="card"><h3>Gemini 3.8 Flash Clinical & Patient Notes</h3><div id="notes"></div></div>
</div>
<div class="card"><h3>ABDM FHIR R4 & Live BigQuery ADR Warehouse</h3><pre id="json">Ready.</pre></div>
<script>
let curId = null;
fetch('/api/warmup').then(r=>r.json()).then(d=>{document.getElementById('gpu').textContent='Vision Ready: '+(d.gpu||d.status);});
async function run(){
  const f=document.getElementById('f').files[0]; if(!f) return alert('Select a colonoscopy frame');
  const fd=new FormData(); fd.append('file',f); fd.append('bbps_r',r.value); fd.append('bbps_t',t.value); fd.append('bbps_l',l.value); fd.append('withdrawal_sec',w.value);
  document.getElementById('json').textContent='Running L4 detection + Gemini 3.8 Flash...';
  const d=await (await chakraFeedback.request('Analyze upload','/api/analyze',{method:'POST',body:fd})).json();
  curId=d.report.procedure_id; document.getElementById('signBtn').disabled=false;
  document.getElementById('vmeta').textContent=`${d.vision.device} | ${d.vision.latency_ms} ms | Polyps: ${d.vision.count}`;
  document.getElementById('img').src='data:image/jpeg;base64,'+d.vision.overlay_jpg_b64;
  document.getElementById('notes').innerHTML=`<p><b>Status:</b> ${d.report.status}</p><p><b>Clinical:</b> ${d.report.narrative.findings_summary}</p><p><b>English:</b> ${d.report.narrative.patient_discharge_english}</p><p><b>Tamil:</b> ${d.report.narrative.patient_discharge_tamil}</p>`;
  document.getElementById('json').textContent=JSON.stringify(d.report.abdm_fhir_r4,null,2);
}
async function signoff(){
  const d=await (await chakraFeedback.request('Sign off report','/api/signoff/'+curId,{method:'POST'})).json();
  document.getElementById('json').textContent=JSON.stringify({status:d.report.status, bigquery:d.bigquery},null,2);
}
</script></body></html>
